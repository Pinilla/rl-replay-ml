[project]
name = "rl-replay-ml"
version = "0.1.0"
description = "Machine learning on Rocket League replays: rank prediction and next-goal probability"
readme = "README.md"
license = "MIT"
authors = [
    { name = "B. Pinilla" }
]
requires-python = ">=3.13"
dependencies = [
    "kaggle>=2.2.5",
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "remotezip>=0.12.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "six>=1.17.0",
    "subtr-actor-py>=1.5.1",
]

[project.scripts]
rl-replay-ml = "rl_replay:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rl_replay"
